name: AI Lending Audit
on:
  push:
    branches:
      - ai/constructionflow-parity-audit
    paths:
      - .github/ai_lending_audit.py
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/constructionflow-parity-audit
      - run: python .github/ai_lending_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add constructionFlow/docs/LENDING_SCREEN_AUDIT.txt
          git rm .github/ai_lending_audit.py .github/workflows/ai-lending-audit.yml
          git commit -m "Capture lending integration audit"
          git push origin HEAD:ai/constructionflow-parity-audit
