name: Sprint 1 P0 verify

on:
  push:
    branches:
      - claude/construction-flow-p0-audit-ql2vfv

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[p0-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/construction-flow-p0-audit-ql2vfv
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: constructionFlow/package-lock.json

      - name: Install dependencies
        working-directory: constructionFlow
        run: npm ci

      - name: Apply bounded Sprint 1 P0 live-code patch
        working-directory: constructionFlow
        run: node scripts/apply-sprint1-p0-finish.mjs

      - name: Verify
        working-directory: constructionFlow
        run: npm run verify -- --runInBand

      - name: Expo doctor
        working-directory: constructionFlow
        run: npx expo-doctor || true

      - name: Validate iOS bundle
        working-directory: constructionFlow
        run: npx expo export --platform ios

      - name: Commit verified live-code patch
        run: |
          if git diff --quiet; then
            echo "No live-code patch needed"
            exit 0
          fi
          git config user.name "WildBear P0 Verification"
          git config user.email "wildbear.official.co@gmail.com"
          git add constructionFlow/src/games/constructionflow/ConstructionFlowScreen.js
          git commit -m "[p0-auto] wire remaining Sprint 1 P0 systems into live game"
          git push origin HEAD:claude/construction-flow-p0-audit-ql2vfv
