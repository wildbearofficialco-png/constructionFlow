name: AI Lending Syntax Fix
on:
  push:
    branches:
      - ai/constructionflow-parity-audit
    paths:
      - .github/ai_lending_fix.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/constructionflow-parity-audit
      - run: python .github/ai_lending_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add constructionFlow/src/games/constructionflow/ConstructionFlowScreen.js
          git rm .github/ai_lending_fix.py .github/workflows/ai-lending-fix.yml
          git commit -m "Fix lending decline alert syntax"
          git push origin HEAD:ai/constructionflow-parity-audit
