name: AI Finance UI Patch

on:
  push:
    branches:
      - ai/constructionflow-parity-audit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/constructionflow-parity-audit
          fetch-depth: 0
      - run: python .github/ai_finance_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ai-finance-ui-patch.yml .github/ai_finance_patch.py
          git add constructionFlow/src/games/constructionflow/ConstructionFlowScreen.js
          git commit -m "Surface financial ledger in Finance UI"
          git push origin HEAD:ai/constructionflow-parity-audit
