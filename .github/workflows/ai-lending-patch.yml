name: AI Lending Patch
on:
  push:
    branches:
      - ai/constructionflow-parity-audit
    paths:
      - .github/ai_lending_patch.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/constructionflow-parity-audit
      - run: python .github/ai_lending_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add constructionFlow/src/games/constructionflow/ConstructionFlowScreen.js constructionFlow/src/systems/lendingEngine.js
          git rm .github/ai_lending_patch.py .github/workflows/ai-lending-patch.yml
          git commit -m "Wire commercial lending engine into Construction Flow"
          git push origin HEAD:ai/constructionflow-parity-audit
