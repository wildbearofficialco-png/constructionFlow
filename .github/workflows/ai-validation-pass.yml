name: AI Construction Flow Validation

on:
  push:
    branches:
      - ai/constructionflow-parity-audit
    paths:
      - .github/workflows/ai-validation-pass.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/constructionflow-parity-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: constructionFlow/package-lock.json

      - name: Install project dependencies
        working-directory: constructionFlow
        run: npm ci

      - name: Align Expo SDK dependencies
        working-directory: constructionFlow
        run: npx expo install --fix

      - name: Install Expo-supported Jest dependencies
        working-directory: constructionFlow
        run: npx expo install jest-expo jest @types/jest --dev

      - name: Configure Jest scripts
        working-directory: constructionFlow
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts = { ...p.scripts, test: 'jest' };
          p.jest = {
            preset: 'jest-expo',
            setupFiles: ['./jest.setup.js'],
            testPathIgnorePatterns: ['/node_modules/']
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: Run tests
        working-directory: constructionFlow
        run: npm test -- --runInBand

      - name: Run lint
        working-directory: constructionFlow
        run: npm run lint

      - name: Run TypeScript validation
        working-directory: constructionFlow
        run: npx tsc --noEmit

      - name: Run Expo Doctor
        working-directory: constructionFlow
        run: npx expo-doctor

      - name: Regenerate single-file Snack build
        working-directory: constructionFlow
        run: node scripts/build-snack-single.js

      - name: Verify Snack has no local gameplay imports
        working-directory: constructionFlow
        run: |
          if grep -E 'from "\.\.?/|require\("\.\.?/' snack/ConstructionFlowSnack.js; then
            echo 'Snack build still contains a local import/require.'
            exit 1
          fi
          test -s snack/ConstructionFlowSnack.js

      - name: Commit validated test setup and Snack build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ai-validation-pass.yml
          git add constructionFlow/package.json constructionFlow/package-lock.json constructionFlow/snack/ConstructionFlowSnack.js constructionFlow/scripts/build-snack-single.js constructionFlow/jest.setup.js
          git commit -m "Validate Construction Flow and regenerate Snack build"
          git push origin HEAD:ai/constructionflow-parity-audit
