name: AI Regional Economy Patch

on:
  push:
    branches:
      - ai/constructionflow-parity-audit
    paths:
      - .github/workflows/ai-regional-economy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/constructionflow-parity-audit
          fetch-depth: 0
      - run: python .github/ai_regional_economy_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/ai_regional_economy_patch.py .github/workflows/ai-regional-economy-patch.yml
          git add constructionFlow/src/games/constructionflow/ConstructionFlowScreen.js
          git commit -m "Wire regional economy into Construction Flow"
          git push origin HEAD:ai/constructionflow-parity-audit
